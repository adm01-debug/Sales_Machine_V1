name: CI

# Portão de qualidade do Sales Machine em PRs e na main: lint, tipos, testes e build,
# com a mesma instalação da Vercel (bun install --frozen-lockfile, Bun 1.4.0).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Instalar dependências (lockfile congelado, igual à Vercel)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Tipos
        run: bunx tsc --noEmit
      - name: Testes
        run: bun run test
      - name: Build
        run: bun run build
